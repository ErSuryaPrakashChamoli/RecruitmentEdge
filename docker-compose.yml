# The web app, scheduler and queue workers share one image, env and storage volumes. Only `app`
# runs migrations on start (RUN_MIGRATIONS); the scheduler/queue containers set it to "false" so
# they never race the app container's migration run.
#
# Queue topology (Phase 8.3, revised in Phase 8.7 — D8.7-001/002/020 — and Phase 8.9 — ED-05/06;
# runbook: docs/runbooks/queue-operations.md). Every application queue is consumed:
# - `queue`: candidate messages (bulk, provider-latency bound);
# - `queue-priority` (Phase 8.9): `security` first — password reset, email-change verification
#   and notice, candidate portal links, step-up OTP codes — then `notifications` (in-app and
#   platform alerts), so neither ever waits behind a burst of candidate messages;
# - `queue-automation`: automation runs and ownership handoffs, so a burst of messages never
#   starves automation (and the reverse);
# - `queue-background`: slow provider calls (AI, embeddings, calendar and job-board APIs, Outcome
#   Loop / Hiring Memory capture) and Filament exports (`exports`).
# All four also take `default` as a fallback (it should stay empty).
#
# Timeouts: DB_QUEUE_RETRY_AFTER (330) must stay above the longest worker --timeout (300), or a job
# still running is handed to a second worker. stop_grace_period (330s) lets a worker finish its
# current job after SIGTERM before Docker kills it; the entrypoint execs the worker directly (no
# shell in between) so the signal reaches it.
x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  image: recruitment-edge-app
  env_file:
    - .env
  volumes:
    - storage-data:/var/www/html/storage/app
    - storage-logs:/var/www/html/storage/logs
  depends_on:
    db:
      condition: service_healthy

x-app-environment: &app-environment
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-recruitment_edge}
  DB_USERNAME: ${DB_USERNAME:-recruitment_edge}
  DB_PASSWORD: ${DB_PASSWORD:-secret}
  DB_QUEUE_RETRY_AFTER: "330"

services:
  app:
    <<: *app-base
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "true"

  # The only scheduler (D8.7-011): never add a cron `schedule:run` beside it.
  scheduler:
    <<: *app-base
    restart: unless-stopped
    stop_grace_period: 330s
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

  queue:
    <<: *app-base
    restart: unless-stopped
    stop_grace_period: 330s
    command: ["php", "artisan", "queue:work", "--queue=communications,default", "--tries=3", "--timeout=120", "--max-time=3600"]
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

  queue-priority:
    <<: *app-base
    restart: unless-stopped
    stop_grace_period: 330s
    command: ["php", "artisan", "queue:work", "--queue=security,notifications,default", "--tries=3", "--timeout=120", "--max-time=3600"]
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

  queue-automation:
    <<: *app-base
    restart: unless-stopped
    stop_grace_period: 330s
    command: ["php", "artisan", "queue:work", "--queue=automation,default", "--tries=3", "--timeout=120", "--max-time=3600"]
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

  queue-background:
    <<: *app-base
    restart: unless-stopped
    stop_grace_period: 330s
    command: ["php", "artisan", "queue:work", "--queue=intelligence,integrations,exports,default", "--tries=3", "--timeout=300", "--max-time=3600"]
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-recruitment_edge}
      MYSQL_USER: ${DB_USERNAME:-recruitment_edge}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      # Phase 8.9 (P89-SEC-006): root never has an empty password; the image generates a random one
      # (printed once in the container log) and the application uses its own non-root user. Set
      # DB_PASSWORD from the secret store in production.
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  storage-data:
  storage-logs:
