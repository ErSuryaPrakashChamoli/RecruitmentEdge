# Phase 8.9 (P89-SEC-008, P89-OPS-006): the access log records the path without its query string —
# signed links (portal set-password, self-scheduling, private files) carry their signature there —
# and no Referer (which can carry such a URL). It adds the request id the application echoes
# (X-Request-Id, the same id as in the application log and audit rows) and the duration in µs.
LogFormat "%h %l %u %t \"%m %U %H\" %>s %O \"%{User-Agent}i\" %{X-Request-Id}o %D" recruitment_edge

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log recruitment_edge
</VirtualHost>
